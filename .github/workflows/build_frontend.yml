name: Rebuild frontend/dist

on:
  push:
    branches: [main, staging]
    paths:
      - 'frontend/**'
      - '!frontend/dist/**'
      - '!frontend/__init__.py'
      - '.github/workflows/build_frontend.yml'
  workflow_dispatch:

# Read-only by default. The privileged write is done by the dist-bot App token,
# minted in the `commit` job below and nowhere else.
permissions:
  contents: read

# Shared with sync_staging.yml, which also pushes to `staging`. Concurrency
# groups are repo-scoped rather than workflow-scoped, so keying the group on the
# branch being written serializes the two against each other — without it they
# interleave and whichever pushes second is rejected as a non-fast-forward, with
# no retry on either side. Keyed by ref so a main rebuild and a staging rebuild
# still run in parallel: they write different branches.
#
# `queue: max` is load-bearing, not decoration. GitHub's default is
# `queue: single`: at most one run may be *pending* per group, and a newer
# pending run cancels the older one. Since this workflow shares a group with the
# sync, the default would let a staging rebuild silently evict a pending
# main -> staging sync — which never retries, stranding main's commits and
# breaking the very invariant the sync exists to hold. (`queue: max` may not be
# combined with `cancel-in-progress: true`; that is a validation error.)
concurrency:
  group: branch-write-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  # Deliberately unprivileged, and deliberately a separate job from the push.
  #
  # `npm ci` and `npm run build` execute code from the repository — lifecycle
  # scripts, the vite config, every transitive dependency. If the dist-bot
  # credential were present on this runner it would sit in `.git/config` as a
  # basic-auth header for any of that code to read. That App is on `main`'s
  # PR-bypass list, and this workflow also runs on `staging`, which is
  # unprotected: anyone able to push to `staging` could then push to protected
  # `main` as the App. Splitting the job is what makes that impossible — the
  # build never holds a credential that can write anywhere.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          # Vite 8 requires ^20.19.0 or >=22.12.0; on Node 18 `npm run build`
          # fails, which silently stops dist from being rebuilt.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Hand the bundle to the commit job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: frontend-dist
          path: frontend/dist
          include-hidden-files: true
          retention-days: 1

  # The only job that holds a credential, and it runs no repository code.
  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # download-artifact
    steps:
      # Mint a short-lived token from the dist-bot GitHub App. The default
      # GITHUB_TOKEN / github-actions[bot] cannot be granted PR-bypass on a
      # protected branch (GitHub blocks the first-party token), so it can't
      # push the rebuilt dist back to a protected branch. A real GitHub App can
      # be added to the branch's PR-bypass list, and its token expires when the
      # job ends. `staging` is unprotected today, so only `main` needs the
      # bypass entry — if `staging` ever gets protected, add the App there too
      # or this job starts failing on it.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        id: app-token
        with:
          app-id: ${{ secrets.DIST_BOT_APP_ID }}
          private-key: ${{ secrets.DIST_BOT_PRIVATE_KEY }}
      # Persisting the App credential is the whole mechanism here: the `git push`
      # below reuses it on the origin remote. The token is minted per-run by the
      # App and expires when the job ends, so it cannot outlive the workflow.
      # No `npm` runs on this runner, so nothing from the repository ever
      # executes alongside it. lfs is not fetched: nothing under frontend/dist
      # is LFS-tracked (`dist/** -filter` in frontend/.gitattributes), and this
      # job stages nothing else.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:  # zizmor: ignore[artipacked]
          token: ${{ steps.app-token.outputs.token }}

      # Emptied first so files the build *removed* are actually removed. The
      # bundle is content-hash-named, so a stale chunk left behind would be
      # committed forever otherwise. (The old single-job version got this free:
      # vite's own emptyOutDir did it in place.)
      - name: Clear the committed bundle
        run: rm -rf frontend/dist

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Commit dist if changed
        # `app-slug` goes through env rather than being interpolated straight
        # into the shell, so the run block holds no expansion sites.
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain frontend/dist)" ]]; then
            # -A so deletions are staged, not just additions and edits.
            git add -A -- frontend/dist
            git commit -m "ci: rebuild frontend/dist [skip ci]"
            # Pushes as the App (credentials persisted by checkout above), which
            # is on main's PR-bypass list. GITHUB_REF_NAME keeps this correct on
            # every branch the workflow runs for, so it lands on staging when
            # staging is what was pushed. dist is path-excluded from this
            # workflow's triggers and the message carries [skip ci], so this push
            # does not start another run — including sync_staging.yml, which is
            # why that workflow also triggers on this one's `workflow_run`
            # rather than relying on the push alone.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "frontend/dist already up to date"
          fi
