# Builds the frontend on every pull request, so a lockfile or source change that
# breaks the build is caught *before* it reaches main.
#
# Why this exists: build_frontend.yml only runs on push to main or staging, so
# until this workflow the first thing to run `npm ci` on Linux was the job that
# fires after a merge. Its failure is silent — frontend/dist just never gets
# rebuilt and prod keeps serving the previous bundle. That has bitten us three times (e345e61,
# 944cb05, c18d42c), each a different flavour of the same root cause: a lockfile
# generated on a developer's machine that ubuntu-latest cannot install.
#
# `npm ci` is the real check here. It is the identical command build_frontend.yml
# runs, on the identical runner, so green here means green there. It fails when
# the lockfile is out of sync with package.json, when platform-specific optional
# deps (esbuild, rollup, @emnapi/*) were pruned by an `npm install` on macOS, and
# when a dependency simply cannot be fetched.
#
# Deliberately NOT path-filtered. Two reasons:
#   1. A required status check that is path-filtered never reports on PRs that
#      skip it, and GitHub blocks the merge waiting for a check that will never
#      arrive.
#   2. Lockfile churn most often arrives as an accident inside an unrelated PR —
#      c18d42c was a rename commit that swept up local npm churn. Running on
#      every PR is what catches that.

name: Frontend

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          # Must match build_frontend.yml. Vite 8 requires ^20.19.0 or >=22.12.0;
          # on Node 18 `npm run build` fails and dist silently stops updating.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # The load-bearing step. If the lockfile is broken, this is where it shows.
      - name: Install (npm ci)
        run: npm ci

      # Two projects, because the root tsconfig.json is a solution file
      # (`"files": []` plus references) — a bare `tsc --noEmit` against it checks
      # nothing and exits 0.
      - name: Typecheck (app)
        run: npx tsc --noEmit -p tsconfig.app.json

      # tsconfig.app.json only includes `src`, so the build's own config files
      # sat outside every project CI ran. That is not hypothetical: it is how a
      # dead `esbuild.pure` option survived the Vite 8 upgrade, silently ending
      # production console.log stripping with nothing going red.
      - name: Typecheck (build configs)
        run: npx tsc --noEmit -p tsconfig.node.json

      # Non-blocking: `npm run lint` currently reports 4 pre-existing errors in 3
      # files — tailwind.config.ts:137,138 (`no-require-imports`),
      # src/components/ui/command.tsx:24 (`no-empty-object-type`) and
      # src/hooks/useSpotlightTarget.ts:58 (`prefer-const`) — plus 24 warnings.
      # Per CLAUDE.md we do not fix pre-existing lint unrelated to a change, so
      # this surfaces regressions in the log without failing the gate on day one.
      # Clear all four and this can become blocking; clearing only the
      # tailwind.config.ts pair would turn the required Build gate red on two
      # untouched `src` files.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
