[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "makermodslab-sdk"
version = "0.0.1"
description = "Agent-first Python SDK for the MakerMods Lab robot server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
realtime = ["websockets>=12"]

[tool.hatch.build.targets.wheel]
packages = ["src/makermodslab_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
